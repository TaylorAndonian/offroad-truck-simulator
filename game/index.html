<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toyota Tacoma TRD Off-Road Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
    canvas { display: block; }

    #controls-panel {
      position: fixed; top: 20px; left: 20px;
      color: rgba(255,255,255,0.85); font-size: 13px;
      background: rgba(0,0,0,0.5); padding: 14px 18px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px); line-height: 1.9; pointer-events: none;
    }
    #controls-panel span { color: #e8c84a; font-weight: bold; }

    #brand { position: fixed; top: 20px; right: 24px; text-align: right; pointer-events: none; }
    #brand h1 { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: 3px; text-transform: uppercase; }
    #brand p  { font-size: 11px; color: #eb0a1e; letter-spacing: 5px; margin-top: 2px; font-weight: bold; }

    #hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 40px 30px; pointer-events: none;
    }
    #rpm-display { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #rpm-label { color: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 3px; }
    #rpm-bar-track { width: 180px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    #rpm-bar-fill {
      height: 100%; width: 10%; border-radius: 4px;
      background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
      transition: width 0.08s;
    }
    #speedo { text-align: center; }
    #speed-num {
      font-size: 80px; font-weight: 900; color: #fff;
      font-variant-numeric: tabular-nums; line-height: 1;
      text-shadow: 0 0 30px rgba(255,255,255,0.3);
    }
    #speed-unit { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 4px; margin-top: 2px; }
    #right-hud { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    #gear-display { font-size: 48px; font-weight: 900; color: #eb0a1e; text-shadow: 0 0 20px rgba(235,10,30,0.6); }
    #cam-display { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 2px; }

    #loading {
      position: fixed; inset: 0; background: #0a0a0a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 100; transition: opacity 0.5s;
    }
    #loading h2 { font-size: 28px; letter-spacing: 4px; margin-bottom: 8px; }
    #loading p  { font-size: 12px; color: #eb0a1e; letter-spacing: 6px; margin-bottom: 40px; }
    #loading-bar-track { width: 260px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
    #loading-bar { width: 0; height: 3px; background: #eb0a1e; border-radius: 2px; transition: width 0.3s; }
    #load-status { margin-top: 16px; font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 3px; }
  </style>
</head>
<body>

<div id="loading">
  <h2>TOYOTA TACOMA</h2>
  <p>TRD OFF-ROAD</p>
  <div id="loading-bar-track"><div id="loading-bar"></div></div>
  <div id="load-status">INITIALIZING</div>
</div>

<div id="controls-panel">
  <div><span>W / ↑</span> &nbsp; Accelerate</div>
  <div><span>S / ↓</span> &nbsp; Brake / Reverse</div>
  <div><span>A / ←</span> &nbsp; Steer Left</div>
  <div><span>D / →</span> &nbsp; Steer Right</div>
  <div><span>SPACE</span> &nbsp; Handbrake</div>
  <div><span>R</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Reset</div>
  <div><span>C</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Camera</div>
  <div><span>Click</span> &nbsp; Mouse Look</div>
</div>

<div id="brand">
  <h1>Toyota Tacoma</h1>
  <p>TRD OFF-ROAD</p>
</div>

<div id="hud">
  <div id="rpm-display">
    <div id="rpm-label">RPM</div>
    <div id="rpm-bar-track"><div id="rpm-bar-fill"></div></div>
  </div>
  <div id="speedo">
    <div id="speed-num">0</div>
    <div id="speed-unit">MPH</div>
  </div>
  <div id="right-hud">
    <div id="gear-display">N</div>
    <div id="cam-display">CHASE CAM</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>

// ─────────────────────────────────────────────
// LOADING HELPERS
// ─────────────────────────────────────────────
const loadingBar    = document.getElementById('loading-bar');
const loadingStatus = document.getElementById('load-status');
let _loadPct = 0;
function setLoading(pct, label) {
  _loadPct = Math.max(_loadPct, pct);
  loadingBar.style.width = _loadPct + '%';
  if (label) loadingStatus.textContent = label;
}
function hideLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.style.display = 'none', 520);
}
setLoading(5, 'STARTING RENDERER');

// ─────────────────────────────────────────────
// RENDERER
// ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x6AADCC);
scene.fog = new THREE.Fog(0x6AADCC, 80, 320);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 800);

// ─────────────────────────────────────────────
// LIGHTING
// ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xd4e8ff, 0.55));

const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 600;
sun.shadow.camera.left = sun.shadow.camera.bottom = -120;
sun.shadow.camera.right = sun.shadow.camera.top  =  120;
sun.shadow.bias = -0.001;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x6688cc, 0.4).position.set(-40, 20, -60) && new THREE.DirectionalLight(0x6688cc, 0.4));

const fillLight = new THREE.DirectionalLight(0x6688cc, 0.4);
fillLight.position.set(-40, 20, -60);
scene.add(fillLight);

// Sky
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { top: { value: new THREE.Color(0x3a7bbd) }, bot: { value: new THREE.Color(0xb8dff0) } },
  vertexShader:   `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top,bot; varying vec3 vP; void main(){ float t=clamp((vP.y+50.0)/300.0,0.0,1.0); gl_FragColor=vec4(mix(bot,top,t),1.0); }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500,16,8), skyMat));
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(8,32), new THREE.MeshBasicMaterial({color:0xfffae0}));
sunDisc.position.set(200,280,-200); sunDisc.lookAt(0,0,0); scene.add(sunDisc);

// ─────────────────────────────────────────────
// TERRAIN — height function + visual mesh
// ─────────────────────────────────────────────
function heightAt(x, z) {
  return (
    Math.sin(x*0.04)*Math.cos(z*0.04)*5.5 +
    Math.sin(x*0.11+1.7)*Math.cos(z*0.09+0.5)*2.8 +
    Math.sin(x*0.28+0.3)*Math.cos(z*0.25+1.1)*1.2 +
    Math.sin(x*0.6)*Math.cos(z*0.55)*0.5
  );
}

const TSIZE = 350, TSEGS = 180;
const tGeo  = new THREE.PlaneGeometry(TSIZE, TSIZE, TSEGS, TSEGS);
tGeo.rotateX(-Math.PI/2);
const tPos = tGeo.attributes.position;
const vCol = new Float32Array(tPos.count * 3);
for (let i = 0; i < tPos.count; i++) {
  const x = tPos.getX(i), z = tPos.getZ(i), y = heightAt(x,z);
  tPos.setY(i, y);
  const t = Math.max(0, Math.min(1, (y+5)/12));
  vCol[i*3]=0.62+t*0.18; vCol[i*3+1]=0.48+t*0.12; vCol[i*3+2]=0.30+t*0.04;
}
tGeo.setAttribute('color', new THREE.BufferAttribute(vCol,3));
tGeo.computeVertexNormals();
const terrain = new THREE.Mesh(tGeo, new THREE.MeshPhongMaterial({vertexColors:true, shininess:5}));
terrain.receiveShadow = true;
scene.add(terrain);

setLoading(15, 'BUILDING WORLD');

// ─────────────────────────────────────────────
// CANNON.JS WORLD
// ─────────────────────────────────────────────
const world = new CANNON.World();
world.gravity.set(0, -9.82, 0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.solver.iterations = 10;

// ── Terrain heightfield (matches visual terrain exactly) ──
// Cannon Heightfield: data[xi][yi], local X=world X, local Y=world -Z, local Z (height)=world Y
// Body rotated -π/2 around X so heights go up (+Y world), positioned at terrain corner.
const HF_N    = 64;
const HF_ELEM = TSIZE / (HF_N - 1);
const hfData  = [];
for (let xi = 0; xi < HF_N; xi++) {
  hfData.push([]);
  for (let yi = 0; yi < HF_N; yi++) {
    hfData[xi].push(heightAt(xi * HF_ELEM - TSIZE/2, TSIZE/2 - yi * HF_ELEM));
  }
}
const groundBody = new CANNON.Body({ mass: 0 });
groundBody.addShape(new CANNON.Heightfield(hfData, { elementSize: HF_ELEM }));
groundBody.position.set(-TSIZE/2, 0, TSIZE/2);
groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
world.addBody(groundBody);

// ── Chassis ──
const SPAWN_X = 0, SPAWN_Z = 12;
const chassisShape = new CANNON.Box(new CANNON.Vec3(1.0, 0.45, 2.4));
const chassisBody  = new CANNON.Body({ mass: 1800 });
// Shape offset upward = lower center of mass = more stable
chassisBody.addShape(chassisShape, new CANNON.Vec3(0, 0.3, 0));
chassisBody.linearDamping  = 0.02;
chassisBody.angularDamping = 0.4;
chassisBody.position.set(SPAWN_X, heightAt(SPAWN_X, SPAWN_Z) + 3, SPAWN_Z);
world.addBody(chassisBody);

// ── RaycastVehicle ──
const vehicle = new CANNON.RaycastVehicle({
  chassisBody,
  indexRightAxis:   0,  // +X = right
  indexUpAxis:      1,  // +Y = up
  indexForwardAxis: 2,  // +Z = forward
});

const wheelBase = {
  radius:                          0.38,
  directionLocal:                  new CANNON.Vec3(0, -1, 0),
  suspensionStiffness:             30,
  suspensionRestLength:            0.35,
  frictionSlip:                    1.5,
  dampingRelaxation:               2.3,
  dampingCompression:              4.4,
  maxSuspensionForce:              100000,
  rollInfluence:                   0.01,
  axleLocal:                       new CANNON.Vec3(1, 0, 0),
  chassisConnectionPointLocal:     new CANNON.Vec3(),
  maxSuspensionTravel:             0.35,
  customSlidingRotationalSpeed:    -30,
  useCustomSlidingRotationalSpeed: true,
};

// Wheel mount points: [right/left, height below chassis center, front/rear]
// Track ±0.9 m, wheelbase front +1.35 / rear −1.35, mount −0.25 below chassis center
[[-0.9,-0.25, 1.35],  // FL
 [ 0.9,-0.25, 1.35],  // FR
 [-0.9,-0.25,-1.35],  // RL
 [ 0.9,-0.25,-1.35],  // RR
].forEach(([x,y,z]) => {
  wheelBase.chassisConnectionPointLocal.set(x,y,z);
  vehicle.addWheel({...wheelBase, chassisConnectionPointLocal: new CANNON.Vec3(x,y,z)});
});

vehicle.addToWorld(world);

setLoading(25, 'LOADING MODEL');

// ─────────────────────────────────────────────
// PROPS — rocks, trees, cacti
// ─────────────────────────────────────────────
const rockMat    = new THREE.MeshPhongMaterial({color:0x888877,shininess:8});
const treeBase   = new THREE.MeshPhongMaterial({color:0x4A3018});
const foliageMat = new THREE.MeshPhongMaterial({color:0x2D6A2D});
const cactusMat  = new THREE.MeshPhongMaterial({color:0x3A7A3A});

function addRock(x,z) {
  const s = 0.6+Math.random()*1.8;
  const g = new THREE.DodecahedronGeometry(s,0);
  g.rotateY(Math.random()*Math.PI*2); g.rotateX(Math.random()*0.5);
  const m = new THREE.Mesh(g,rockMat); m.castShadow=m.receiveShadow=true;
  m.position.set(x,heightAt(x,z)+s*0.5-0.1,z); scene.add(m);
}
function addTree(x,z) {
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.25,2.2,7),treeBase);
  trunk.position.y=1.1; trunk.castShadow=true; g.add(trunk);
  for(let i=0;i<3;i++){
    const cone=new THREE.Mesh(new THREE.ConeGeometry(1.6-i*0.35,1.8,7),foliageMat);
    cone.position.y=1.9+i*1.1; cone.castShadow=true; g.add(cone);
  }
  g.position.set(x,heightAt(x,z),z); scene.add(g);
}
function addCactus(x,z) {
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.22,2.8,7),cactusMat);
  body.position.y=1.4; body.castShadow=true; g.add(body);
  for(let i=0;i<2;i++){
    const a=i===0?-0.5:0.5;
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.0,6),cactusMat);
    arm.position.set(Math.sin(a)*0.35,1.4,0); arm.rotation.z=a; arm.castShadow=true; g.add(arm);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.6,6),cactusMat);
    top.position.set(Math.sin(a)*0.7,1.9,0); top.castShadow=true; g.add(top);
  }
  g.position.set(x,heightAt(x,z),z); scene.add(g);
}
for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,d=18+Math.random()*150;addRock(Math.cos(a)*d,Math.sin(a)*d);}
for(let i=0;i<35;i++){const a=Math.random()*Math.PI*2,d=30+Math.random()*130;addTree(Math.cos(a)*d,Math.sin(a)*d);}
for(let i=0;i<25;i++){const a=Math.random()*Math.PI*2,d=20+Math.random()*140;addCactus(Math.cos(a)*d,Math.sin(a)*d);}

// ─────────────────────────────────────────────
// TRUCK GROUP + HEADLIGHTS
// ─────────────────────────────────────────────
const truck = new THREE.Group();
scene.add(truck);

function makeSpot(x,y,z,tx,ty,tz) {
  const s = new THREE.SpotLight(0xFFF5CC,3,40,Math.PI/8,0.4);
  s.position.set(x,y,z); truck.add(s);
  const t = new THREE.Object3D(); t.position.set(tx,ty,tz);
  truck.add(t); s.target=t;
}
makeSpot(-0.5,0.9,2.3,-0.5,0.3,15);
makeSpot( 0.5,0.9,2.3, 0.5,0.3,15);

// ─────────────────────────────────────────────
// WHEEL PIVOT BUILDER
// ─────────────────────────────────────────────
function buildWheelPivot(glbModel, prefix) {
  const meshes = [];
  glbModel.traverse(c => {
    if (c.isMesh && c.name.toLowerCase().startsWith(prefix)) meshes.push(c);
  });
  if (!meshes.length) return null;
  const bbox = new THREE.Box3();
  meshes.forEach(m => bbox.expandByObject(m));
  const worldCenter = bbox.getCenter(new THREE.Vector3());
  const pivot = new THREE.Group();
  pivot.position.copy(glbModel.worldToLocal(worldCenter.clone()));
  glbModel.add(pivot);
  meshes.forEach(m => pivot.attach(m));
  return pivot;
}

// ─────────────────────────────────────────────
// PBR MATERIALS
// ─────────────────────────────────────────────
function buildMaterials() {
  return {
    'body': new THREE.MeshPhysicalMaterial({color:0x4B5E3D,metalness:0.0,roughness:0.22,clearcoat:1.0,clearcoatRoughness:0.08}),
    'plastic': new THREE.MeshStandardMaterial({color:0x111111,roughness:0.82,metalness:0.02}),
    'dark': new THREE.MeshStandardMaterial({color:0x080808,roughness:0.92,metalness:0.0}),
    'glass': new THREE.MeshPhysicalMaterial({color:0x080c10,metalness:0.08,roughness:0.0,transmission:0.0,transparent:false,side:THREE.DoubleSide}),
    'rear_lights': new THREE.MeshStandardMaterial({color:0xcc1100,roughness:0.25,emissive:new THREE.Color(0xcc1100),emissiveIntensity:0.55,transparent:true,opacity:0.9}),
    'brake_lights': new THREE.MeshStandardMaterial({color:0xdd0000,roughness:0.20,emissive:new THREE.Color(0xcc0000),emissiveIntensity:0.60}),
    'reverse_lights': new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:0.30,emissive:new THREE.Color(0xddddcc),emissiveIntensity:0.35}),
    'turnsignal_lights': new THREE.MeshStandardMaterial({color:0xff8800,roughness:0.28,emissive:new THREE.Color(0xdd6600),emissiveIntensity:0.45}),
    'mirrors': new THREE.MeshStandardMaterial({color:0xb0b0a8,metalness:0.88,roughness:0.12}),
    'headlights': new THREE.MeshStandardMaterial({color:0xcccccc,metalness:0.92,roughness:0.10}),
    'headlights_glass': new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0.0,roughness:0.0,transmission:0.88,transparent:true,opacity:0.10,ior:1.50,side:THREE.DoubleSide}),
    'front_lights': new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.25,emissive:new THREE.Color(0xeeeeff),emissiveIntensity:0.70}),
    'Tires': new THREE.MeshStandardMaterial({color:0x141414,roughness:0.94,metalness:0.0}),
    'rim_main': new THREE.MeshStandardMaterial({color:0x222220,metalness:0.80,roughness:0.40}),
    'rim_color': new THREE.MeshStandardMaterial({color:0xb8b8b0,metalness:0.95,roughness:0.15}),
  };
}

// ─────────────────────────────────────────────
// LOAD GLB
// ─────────────────────────────────────────────
let steerGroups = [];
let spinMeshes  = [];
let gameReady   = false;

const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

gltfLoader.load(
  'toyota_tacoma_trd.glb',
  (gltf) => {
    setLoading(88, 'PROCESSING MODEL');
    const model = gltf.scene;

    // Scale to ~5 m
    const bbox  = new THREE.Box3().setFromObject(model);
    const size  = bbox.getSize(new THREE.Vector3());
    const scale = 5.0 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(scale);

    // Center XZ, sit bottom at y=0 in truck local space
    bbox.setFromObject(model);
    const center = bbox.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= bbox.min.y;

    // GLB natural forward is -X → rotate -π/2 to face +Z (drive direction)
    model.rotation.y = -Math.PI / 2;

    // PBR materials
    const MAT = buildMaterials();
    model.traverse(child => {
      if (!child.isMesh) return;
      child.castShadow = child.receiveShadow = true;
      const matName = child.material?.name || '';
      if (MAT[matName]) {
        child.material = MAT[matName];
      } else if (child.material) {
        child.material = child.material.clone();
        child.material.needsUpdate = true;
      }
    });

    truck.add(model);
    model.updateWorldMatrix(true, true);

    // Wheel pivots
    ['fl','fr','rl','rr'].forEach((prefix, i) => {
      const pivot = buildWheelPivot(model, prefix);
      if (pivot) {
        spinMeshes.push(pivot);
        if (i < 2) steerGroups.push(pivot);
      }
    });

    setLoading(100, 'READY');
    setTimeout(() => { hideLoading(); gameReady = true; }, 350);
  },
  (xhr) => {
    if (xhr.total) setLoading(25 + (xhr.loaded/xhr.total)*63, `LOADING MODEL ${Math.round(xhr.loaded/xhr.total*100)}%`);
  },
  (err) => { console.error('GLB error:', err); loadingStatus.textContent='ERROR — CHECK CONSOLE'; }
);

// ─────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

window.addEventListener('keydown', e => {
  if (e.code === 'KeyR') {
    // Reset chassis to spawn
    chassisBody.position.set(SPAWN_X, heightAt(SPAWN_X,SPAWN_Z)+3, SPAWN_Z);
    chassisBody.velocity.set(0,0,0);
    chassisBody.angularVelocity.set(0,0,0);
    chassisBody.quaternion.set(0,0,0,1);
  }
  if (e.code === 'KeyC') {
    camMode = (camMode+1)%3;
    document.getElementById('cam-display').textContent = CAM_LABELS[camMode];
  }
});

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
  if (document.pointerLockElement) {
    mouseX -= e.movementX * 0.003;
    mouseY  = Math.max(-0.25, Math.min(0.5, mouseY + e.movementY * 0.003));
  }
});
renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

// ─────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────
let audioCtx, osc1, osc2, gainNode;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  gainNode = audioCtx.createGain(); gainNode.gain.value=0.07; gainNode.connect(audioCtx.destination);
  osc1 = audioCtx.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=42;
  osc1.connect(gainNode); osc1.start();
  osc2 = audioCtx.createOscillator(); osc2.type='square'; osc2.frequency.value=28;
  const g2 = audioCtx.createGain(); g2.gain.value=0.4;
  osc2.connect(g2); g2.connect(gainNode); osc2.start();
}
window.addEventListener('keydown', initAudio, {once:true});

// ─────────────────────────────────────────────
// DUST
// ─────────────────────────────────────────────
const DUST_N = 100;
const dPos=new Float32Array(DUST_N*3), dLife=new Float32Array(DUST_N).fill(-1);
const dVx=new Float32Array(DUST_N), dVz=new Float32Array(DUST_N);
for(let i=0;i<DUST_N;i++) dPos[i*3+1]=-999;
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(dPos,3));
scene.add(new THREE.Points(dGeo,new THREE.PointsMaterial({color:0xC4A878,size:2.2,transparent:true,opacity:0.35,sizeAttenuation:true,depthWrite:false})));
let dustTimer=0;
function updateDust(dt, pos, speed) {
  dustTimer+=dt;
  if(Math.abs(speed)>1.5 && dustTimer>0.04){
    dustTimer=0;
    for(let i=0;i<DUST_N;i++){
      if(dLife[i]<0){
        dPos[i*3]=pos.x+(Math.random()-0.5)*1.4;
        dPos[i*3+1]=pos.y+0.1;
        dPos[i*3+2]=pos.z+(Math.random()-0.5)*1.4;
        dVx[i]=(Math.random()-0.5)*0.6; dVz[i]=(Math.random()-0.5)*0.6;
        dLife[i]=0.9+Math.random()*0.5; break;
      }
    }
  }
  for(let i=0;i<DUST_N;i++){
    if(dLife[i]>0){
      dLife[i]-=dt;
      dPos[i*3]+=dVx[i]*dt; dPos[i*3+1]+=dt*1.2; dPos[i*3+2]+=dVz[i]*dt;
      if(dLife[i]<=0){ dPos[i*3+1]=-999; dLife[i]=-1; }
    }
  }
  dGeo.attributes.position.needsUpdate=true;
}

// ─────────────────────────────────────────────
// GAME LOOP STATE
// ─────────────────────────────────────────────
const MAX_ENGINE_FORCE = 5000;
const MAX_BRAKE_FORCE  = 120;
const MAX_STEER        = 0.5;
const STEER_RATE       = 4.0;  // radians/sec response

let steerAngle = 0;
let rpm = 820, gear = 'N';
let camMode = 0;
const CAM_LABELS = ['CHASE CAM','HOOD CAM','ORBIT CAM'];
const camPos  = new THREE.Vector3();
const camLook = new THREE.Vector3();
const _fwd    = new THREE.Vector3();

const clock = new THREE.Clock();

// ─────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  // ── Keyboard state ──
  const throttle = keys['KeyW'] || keys['ArrowUp'];
  const brake    = keys['KeyS'] || keys['ArrowDown'];
  const left     = keys['KeyA'] || keys['ArrowLeft'];
  const right    = keys['KeyD'] || keys['ArrowRight'];
  const hbrake   = keys['Space'];

  // ── Physics — only apply player input once GLB is loaded ──
  if (gameReady) {
    // Steer (smooth lerp toward target angle)
    const steerTarget = left ? MAX_STEER : (right ? -MAX_STEER : 0);
    steerAngle += (steerTarget - steerAngle) * Math.min(1, STEER_RATE * dt);
    vehicle.setSteeringValue(steerAngle, 0);  // FL
    vehicle.setSteeringValue(steerAngle, 1);  // FR

    // Get signed forward speed (positive = moving forward)
    _fwd.set(0,0,1).applyQuaternion(truck.quaternion);
    const vel = chassisBody.velocity;
    const fwdSpeed = vel.x*_fwd.x + vel.y*_fwd.y + vel.z*_fwd.z;

    // Engine force (negative = forward in Cannon convention with axle +X)
    if (throttle) {
      vehicle.applyEngineForce(-MAX_ENGINE_FORCE, 2);
      vehicle.applyEngineForce(-MAX_ENGINE_FORCE, 3);
    } else if (brake && fwdSpeed < -0.5) {
      // Moving in reverse: apply forward engine to slow down
      vehicle.applyEngineForce(-MAX_ENGINE_FORCE * 0.5, 2);
      vehicle.applyEngineForce(-MAX_ENGINE_FORCE * 0.5, 3);
    } else {
      vehicle.applyEngineForce(0, 2);
      vehicle.applyEngineForce(0, 3);
    }

    // Braking
    const bf = hbrake ? MAX_BRAKE_FORCE * 5
             : (brake && fwdSpeed > 0.5) ? MAX_BRAKE_FORCE
             : 4;  // slight rolling resistance at idle
    for (let i = 0; i < 4; i++) vehicle.setBrake(bf, i);

    // Reverse: when nearly stopped and brake held, apply negative engine
    if (brake && Math.abs(fwdSpeed) < 1.0) {
      vehicle.applyEngineForce(MAX_ENGINE_FORCE * 0.4, 2);
      vehicle.applyEngineForce(MAX_ENGINE_FORCE * 0.4, 3);
    }
  }

  // ── Step physics (always, so chassis settles even before GLB loads) ──
  world.step(1/60, dt, 3);

  // ── Sync Three.js truck to Cannon chassis ──
  truck.position.copy(chassisBody.position);
  truck.quaternion.copy(chassisBody.quaternion);

  // ── Wheel visual updates ──
  vehicle.wheelInfos.forEach((wheel, i) => {
    vehicle.updateWheelTransform(i);
    if (i < 2 && steerGroups[i]) {
      steerGroups[i].rotation.y = -wheel.steering;
    }
    if (spinMeshes[i]) {
      spinMeshes[i].rotation.z += wheel.deltaRotation;
    }
  });

  // ── Derived values for HUD / audio / camera ──
  _fwd.set(0,0,1).applyQuaternion(truck.quaternion);
  const truckYaw = Math.atan2(_fwd.x, _fwd.z);
  const vel = chassisBody.velocity;
  const fwdSpeed = vel.x*_fwd.x + vel.y*_fwd.y + vel.z*_fwd.z;
  const mph = Math.abs(fwdSpeed) * 2.237;

  // ── Simulated RPM / gear ──
  const throttle2 = keys['KeyW'] || keys['ArrowUp']; // re-read for audio
  const targetRPM = throttle2
    ? 820 + Math.abs(fwdSpeed)*195 + (Math.random()-0.5)*80
    : 820 + Math.abs(fwdSpeed)*95;
  rpm += (targetRPM - rpm) * 4 * dt;
  rpm  = Math.max(820, Math.min(6800, rpm));

  if (fwdSpeed < -0.5)         gear = 'R';
  else if (Math.abs(fwdSpeed) < 0.5) gear = 'N';
  else if (rpm < 1800)         gear = '1';
  else if (rpm < 2600)         gear = '2';
  else if (rpm < 3400)         gear = '3';
  else if (rpm < 4300)         gear = '4';
  else                         gear = '5';

  // ── Audio ──
  if (osc1) {
    const f = 20 + rpm * 0.016;
    osc1.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.06);
    osc2.frequency.setTargetAtTime(f*0.5, audioCtx.currentTime, 0.06);
    gainNode.gain.setTargetAtTime(throttle2?0.09:0.06, audioCtx.currentTime, 0.1);
  }

  // ── Camera ──
  const tp = truck.position;
  if (camMode === 0) {
    const orbitYaw   = truckYaw + mouseX;
    const orbitPitch = mouseY;
    const dist=9.5, height=4.0;
    const tx = tp.x - Math.sin(orbitYaw)*dist*Math.cos(orbitPitch);
    const ty = tp.y + height + Math.sin(orbitPitch)*dist;
    const tz = tp.z - Math.cos(orbitYaw)*dist*Math.cos(orbitPitch);
    camPos.lerp(new THREE.Vector3(tx,ty,tz), Math.min(1,5*dt));
    camLook.lerp(new THREE.Vector3(tp.x,tp.y+1.2,tp.z), Math.min(1,8*dt));
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  } else if (camMode === 1) {
    const up = tp.clone().add(_fwd.clone().multiplyScalar(2.0)).add(new THREE.Vector3(0,1.6,0));
    camera.position.copy(up);
    camera.lookAt(tp.clone().add(_fwd.clone().multiplyScalar(25)));
  } else {
    const oa=t*0.18, od=14+Math.sin(t*0.12)*3, oh=5+Math.sin(t*0.17)*2;
    camera.position.set(tp.x+Math.cos(oa)*od, tp.y+oh, tp.z+Math.sin(oa)*od);
    camera.lookAt(tp.x, tp.y+1, tp.z);
  }

  // Follow shadow
  sun.position.set(tp.x+60,90,tp.z+40);
  sun.target.position.copy(tp);
  sun.target.updateMatrixWorld();

  // ── Dust ──
  updateDust(dt, tp, fwdSpeed);

  // ── HUD ──
  if (gameReady) {
    document.getElementById('speed-num').textContent = Math.round(mph);
    document.getElementById('gear-display').textContent = gear;
    document.getElementById('rpm-bar-fill').style.width = Math.min(100, ((rpm-820)/6000)*100)+'%';
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
